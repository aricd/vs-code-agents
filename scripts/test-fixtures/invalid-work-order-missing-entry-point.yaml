# invalid-work-order-missing-entry-point.yaml
# Gate script fixture — DEMONSTRATED ITEM WITH NULL entry_point
# Expected: run-work-order-gates[.ps1|.sh] exits 1
# Error must contain: "Demonstrated item" and the item ID, with the entry_point
# message SPECIFICALLY (not the disconfirm one) — REQ-030 repair. disconfirm is
# deliberately non-null here so this fixture asserts exactly one rule: before the
# repair this item also had disconfirm: null, so once REQ-028 shipped it would fail
# for BOTH reasons and this fixture's oracle would become dependent on check order
# (RISK-011). Now it exercises only entry_point.
#
# Validates: the gate script rejects work-orders where a Demonstrated
# checklist item has a null (or absent) entry_point. A Demonstrated
# criterion without a wired entry_point is tautological — the check
# cannot produce runtime evidence.

