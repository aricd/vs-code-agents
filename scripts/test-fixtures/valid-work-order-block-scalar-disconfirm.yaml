# valid-work-order-block-scalar-disconfirm.yaml
# Gate script fixture — POSITIVE: disconfirm as BOTH `>` and `|` block scalars
# Expected: run-work-order-gates[.ps1|.sh] exits 0 (both before AND after the
# REQ-028/029 fix — this fixture is not part of the red-against-pre-fix set: before
# the fix, disconfirm is simply unread, so a valid work-order stays valid; after the
# fix, non-empty block-scalar content must read as present, so it stays valid too).
